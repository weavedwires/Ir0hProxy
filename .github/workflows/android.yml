name: android

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HEV_REPO: heiher/hev-socks5-tunnel
  HEV_VERSION: 2.19.3
  DUMBPIPE_REPO: weavedwires/dumbpipe-over-chatmail
  DUMBPIPE_VERSION: v0.40.1
  NDK_VERSION: r27d
  JNI_PKG: su/weavedwires/iroh/vpn/tun
  JNI_CLS: TunNativeTool

jobs:
  hev:
    name: tun2socks из исходников
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Собрать libhev-socks5-tunnel.so для четырёх ABI
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hev-socks5-tunnel"
          git clone --quiet --depth 1 --branch "$HEV_VERSION" --recursive \
            "https://github.com/$HEV_REPO" "$src"
          mkdir -p "$RUNNER_TEMP/obj" "$RUNNER_TEMP/libs"
          (
            cd "$src"
            "$NDK/ndk-build" \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=Android.mk \
              NDK_APPLICATION_MK=Application.mk \
              APP_ABI="arm64-v8a armeabi-v7a x86 x86_64" \
              APP_PLATFORM=android-23 \
              APP_CFLAGS="-O3 -DPKGNAME=$JNI_PKG -DCLSNAME=$JNI_CLS" \
              NDK_OUT="$RUNNER_TEMP/obj" \
              NDK_LIBS_OUT="$RUNNER_TEMP/libs"
          )
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            install -D -m 0644 "$RUNNER_TEMP/libs/$abi/libhev-socks5-tunnel.so" \
              "dist/$abi/libhev-socks5-tunnel.so"
          done

      - name: Отдать libhev-socks5-tunnel.so
        uses: actions/upload-artifact@v7
        with:
          name: libhev-socks5-tunnel
          path: dist
          if-no-files-found: error

  dumbpipe:
    name: dumbpipe из исходников (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            clang: armv7a-linux-androideabi24-clang
          - target: x86_64-linux-android
            abi: x86_64
            clang: x86_64-linux-android24-clang
          - target: i686-linux-android
            abi: x86
            clang: i686-linux-android24-clang
    steps:
      - uses: actions/checkout@v7

      - name: Rust с таргетом ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: NDK ${{ env.NDK_VERSION }}
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Собрать libdumbpipe.so для ${{ matrix.abi }}
        env:
          NDK_BIN: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          TARGET: ${{ matrix.target }}
          CLANG: ${{ matrix.clang }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/dumbpipe"
          git clone --quiet --depth 1 --branch "$DUMBPIPE_VERSION" \
            "https://github.com/$DUMBPIPE_REPO" "$src"
          cc_key="${TARGET//-/_}"
          export "CARGO_TARGET_${cc_key^^}_LINKER=$NDK_BIN/$CLANG"
          export "CC_${cc_key}=$NDK_BIN/$CLANG"
          export "AR_${cc_key}=$NDK_BIN/llvm-ar"
          cd "$src"
          cargo build --locked --release --target "$TARGET"
          install -D -m 0755 "target/$TARGET/release/dumbpipe" "$GITHUB_WORKSPACE/dist/libdumbpipe.so"

      - name: Отдать libdumbpipe.so для ${{ matrix.abi }}
        uses: actions/upload-artifact@v7
        with:
          name: libdumbpipe-${{ matrix.abi }}
          path: dist/libdumbpipe.so
          if-no-files-found: error

  app:
    name: APK
    needs: [hev, dumbpipe]
    runs-on: ubuntu-latest
    env:
      SIGNING_AVAILABLE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Требовать ключ подписи для тега
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNING_AVAILABLE != 'true'
        run: |
          echo "::error::релизный тег требует подписанного APK: задайте KEYSTORE_BASE64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_ALIAS, KEYSTORE_KEY_PASSWORD"
          exit 1

      - name: Забрать libhev-socks5-tunnel.so
        uses: actions/download-artifact@v8
        with:
          name: libhev-socks5-tunnel
          path: natives/hev

      - name: Забрать libdumbpipe.so
        uses: actions/download-artifact@v8
        with:
          pattern: libdumbpipe-*
          path: natives/dumbpipe

      - name: Разложить .so по jniLibs
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            install -D -m 0644 "natives/hev/$abi/libhev-socks5-tunnel.so" \
              "app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
            install -D -m 0755 "natives/dumbpipe/libdumbpipe-$abi/libdumbpipe.so" \
              "app/src/main/jniLibs/$abi/libdumbpipe.so"
          done

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK и платформа android-37.0
        uses: android-actions/setup-android@v4

      - name: Установить platforms;android-37.0 и build-tools;37.0.0
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Юнит-тесты
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Собрать debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Отдать debug APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Подготовить ключ подписи
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.jks keystore.properties

      - name: Собрать подписанный release APK
        if: env.SIGNING_AVAILABLE == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Проверить подпись release APK
        if: env.SIGNING_AVAILABLE == 'true'
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"

      - name: Отдать release APK
        if: env.SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Забрать подписанный APK
        uses: actions/download-artifact@v8
        with:
          name: apk-release
          path: dist

      - name: Опубликовать релиз ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
