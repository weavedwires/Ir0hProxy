name: android

# APK build. The native binaries are gitignored, so CI recreates them from scratch:
#   libhev-socks5-tunnel.so  -> ndk-build of the upstream heiher/hev-socks5-tunnel
#   libdumbpipe.so           -> prebuilt release asset of weavedwires/dumbpipe-over-chatmail
# Signing secrets are optional: without them CI builds a debug APK only.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DUMBPIPE_REPO: weavedwires/dumbpipe-over-chatmail
  DUMBPIPE_VERSION: v0.40.1
  HEV_REPO: heiher/hev-socks5-tunnel
  HEV_VERSION: 2.19.3
  NDK_VERSION: r27d
  # JNI class name is baked into the .so by ndk-build and must match
  # app/src/main/java/su/weavedwires/iroh/vpn/tun/TunNativeTool.java
  JNI_PKG: su/weavedwires/iroh/vpn/tun
  JNI_CLS: TunNativeTool

jobs:
  build:
    name: build apk
    runs-on: ubuntu-latest
    env:
      # `secrets` is not allowed inside `if:`, so resolve it into an env flag first.
      SIGNING_AVAILABLE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Build libhev-socks5-tunnel.so
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/hev-socks5-tunnel"
          git clone --quiet --depth 1 --branch "$HEV_VERSION" --recursive \
            "https://github.com/$HEV_REPO" "$src"
          mkdir -p "$RUNNER_TEMP/hev-obj" "$RUNNER_TEMP/hev-libs"
          (
            cd "$src"
            "$NDK/ndk-build" \
              NDK_PROJECT_PATH=. \
              APP_BUILD_SCRIPT=Android.mk \
              NDK_APPLICATION_MK=Application.mk \
              APP_ABI="arm64-v8a armeabi-v7a x86 x86_64" \
              APP_PLATFORM=android-23 \
              APP_CFLAGS="-O3 -DPKGNAME=$JNI_PKG -DCLSNAME=$JNI_CLS" \
              NDK_OUT="$RUNNER_TEMP/hev-obj" \
              NDK_LIBS_OUT="$RUNNER_TEMP/hev-libs"
          )
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            install -D -m 0644 "$RUNNER_TEMP/hev-libs/$abi/libhev-socks5-tunnel.so" \
              "app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
          done
          find app/src/main/jniLibs -name '*.so' -printf '%p %s bytes\n' | sort

      - name: Fetch libdumbpipe.so
        run: |
          set -euo pipefail
          base="https://github.com/$DUMBPIPE_REPO/releases/download/$DUMBPIPE_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            asset="dumbpipe-$DUMBPIPE_VERSION-dumbpipe-android-$abi"
            curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
            ( cd "$RUNNER_TEMP" && grep -- "  $asset\$" checksums.txt | sha256sum -c - )
            install -D -m 0755 "$RUNNER_TEMP/$asset" "app/src/main/jniLibs/$abi/libdumbpipe.so"
          done
          find app/src/main/jniLibs -name 'libdumbpipe.so' -printf '%p %s bytes\n' | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare signing material
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.jks keystore.properties

      - name: Assemble release APK
        if: env.SIGNING_AVAILABLE == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APK
        if: env.SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk-release
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find dist -name '*.apk' -print -quit)"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
